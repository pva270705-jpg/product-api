name: Production Deploy

on:
  workflow_run:
    workflows:
      - Docker Hub CD
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: docker compose -f docker-compose-prod.yaml pull product-api

      - name: Deploy production containers
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Check production API
        run: |
          for /L %%i in (1,1,12) do (
            curl.exe --fail --silent http://localhost:3001/health
            if not errorlevel 1 exit /b 0
            timeout /t 5 /nobreak >nul
          )
          echo Production API is not healthy after 60 seconds
          exit /b 1

      - name: Show containers
        run: docker ps
