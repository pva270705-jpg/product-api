name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          nohup npm start > api.log 2>&1 &
          sleep 10

      - name: Check API health
        run: |
          curl --fail http://localhost:3000/health

      - name: Create Product
        run: |
          curl -i -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI-001","pname":"CI Product","price":100000,"quantity":10}'

      - name: Get Products
        run: |
          curl --fail http://localhost:3000/api/products

      - name: Get Product By PID
        run: |
          curl -i http://localhost:3000/api/products/CI-001

      - name: Update Product
        run: |
          curl -i -X PUT http://localhost:3000/api/products/CI-001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Updated CI Product","price":120000,"quantity":15}'

      - name: Delete Product
        run: |
          curl -i -X DELETE http://localhost:3000/api/products/CI-001

      - name: Show API log if failed
        if: failure()
        run: cat api.log